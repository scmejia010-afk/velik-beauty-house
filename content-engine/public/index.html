<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sora:wght@300;400;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Sala de control: campo profundo al fondo, instrumentos en rejilla asimétrica,
   la tubería del orquestador como eje vivo entre el resumen y el trabajo. */
:root {
  /* Oscuro por decisión, no por omisión: es un instrumento nocturno. */
  color-scheme: dark;

  --void:      #07060f;   /* el campo profundo */
  --deep:      #0e0c1d;   /* superficie de panel */
  --deep-2:    #15122a;   /* superficie elevada */
  --line:      #241f42;
  --line-hot:  #3a3270;

  --fg:        #e8e5f5;
  --fg-dim:    #8c86b8;
  --fg-faint:  #5d578c;

  --lantern:   #ffc24d;   /* el acento: luz de linterna */
  --aurora:    #4fe0c4;   /* señal viva */
  --ember:     #ff6b5c;   /* alerta */
  --violet:    #a78bfa;

  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body:    "Sora", system-ui, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, monospace;

  --glow-lantern: 0 0 18px rgba(255,194,77,.35);
  --glow-aurora:  0 0 18px rgba(79,224,196,.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--void);
  color: var(--fg);
  font: 300 15px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  position: relative;
  min-height: 100%;
}

/* El campo profundo. Canvas porque es generativo. */
#field {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
/* Rejilla tenue sobre el campo: da la sensación de instrumento calibrado. */
#grid {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(to right, rgba(167,139,250,.055) 1px, transparent 1px) 0 0/72px 72px,
    linear-gradient(to bottom, rgba(167,139,250,.055) 1px, transparent 1px) 0 0/72px 72px;
  mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 20%, transparent 78%);
}

.wrap {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 0 auto;
  padding-block: 26px 80px;
  padding-left: 20px; padding-right: 20px;
}

/* ─── Cabecera de telemetría ─────────────────────────────────── */
.masthead {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px;
  padding-bottom: 18px; margin-bottom: 26px;
  border-bottom: 1px solid var(--line);
}
.mark { display: flex; align-items: center; gap: 13px; min-width: 0; }
.beacon {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, var(--lantern), #b9700c 62%, #3a2206);
  box-shadow: var(--glow-lantern);
  animation: breathe 4.2s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { box-shadow: 0 0 14px rgba(255,194,77,.28); }
  50%     { box-shadow: 0 0 30px rgba(255,194,77,.55); }
}
h1 {
  font: 700 23px/1 var(--display); margin: 0;
  letter-spacing: .055em; text-transform: uppercase; text-wrap: balance;
}
h1 em { font-style: normal; color: var(--lantern); }
.stamp {
  font: 400 11.5px var(--mono); color: var(--fg-faint);
  letter-spacing: .04em; margin-top: 5px;
}
.spacer { flex: 1 1 auto; }

.controls { display: flex; flex-wrap: wrap; gap: 9px; }
button {
  font: 500 12.5px var(--display); letter-spacing: .09em; text-transform: uppercase;
  color: var(--fg); background: var(--deep-2);
  border: 1px solid var(--line-hot); border-radius: 3px;
  padding: 9px 16px; cursor: pointer;
  transition: border-color .18s, color .18s, box-shadow .18s;
}
button:hover { border-color: var(--aurora); color: var(--aurora); box-shadow: var(--glow-aurora); }
button:focus-visible { outline: 2px solid var(--aurora); outline-offset: 2px; }
button.ignite {
  color: var(--void); background: var(--lantern); border-color: var(--lantern);
  font-weight: 700; box-shadow: var(--glow-lantern);
}
button.ignite:hover { color: var(--void); filter: brightness(1.12); }
button:disabled { opacity: .42; cursor: default; box-shadow: none; }
button.ghost { font-size: 11px; padding: 6px 11px; letter-spacing: .07em; }

/* ─── La tubería: el eje de la página ────────────────────────── */
.pipeline {
  background: linear-gradient(180deg, var(--deep-2), var(--deep));
  border: 1px solid var(--line); border-radius: 5px;
  padding: 20px 22px; margin-bottom: 26px;
  overflow-x: auto;
}
.pipe-track { display: flex; align-items: stretch; gap: 0; min-width: 760px; }
.stage { flex: 1 1 0; position: relative; padding-right: 20px; min-width: 0; }
.stage:last-child { padding-right: 0; }
/* El conector: la señal que avanza entre etapas. */
.stage:not(:last-child)::after {
  content: ""; position: absolute; top: 11px; right: 6px; width: 14px; height: 1px;
  background: var(--line-hot);
}
.stage .dot {
  width: 11px; height: 11px; border-radius: 50%; margin-bottom: 11px;
  background: var(--deep); border: 1.5px solid var(--line-hot);
}
.stage.done .dot { background: var(--aurora); border-color: var(--aurora); box-shadow: var(--glow-aurora); }
.stage.live .dot { background: var(--lantern); border-color: var(--lantern); animation: breathe 2s ease-in-out infinite; }
.stage.block .dot { background: var(--ember); border-color: var(--ember); box-shadow: 0 0 16px rgba(255,107,92,.45); }
.stage .label {
  font: 500 10.5px var(--display); letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg-faint);
}
.stage .n {
  font: 700 27px/1 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums;
  color: var(--fg);
}
.stage.block .n { color: var(--ember); }
.stage.live .n { color: var(--lantern); }
.stage .note { font-size: 11.5px; color: var(--fg-faint); margin-top: 3px; }

/* ─── Rejilla de instrumentos ────────────────────────────────── */
.deck { display: grid; gap: 16px; grid-template-columns: 1.55fr 1fr; align-items: start; }
@media (max-width: 880px) { .deck { grid-template-columns: 1fr; } }

.panel {
  background: var(--deep); border: 1px solid var(--line); border-radius: 5px;
  min-width: 0; overflow: hidden;
}
.panel > header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(167,139,250,.055), transparent);
}
.panel > header h2 {
  font: 500 11px var(--display); letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg-dim); margin: 0;
}
.panel > header .tag {
  font: 500 10.5px var(--mono); color: var(--void); background: var(--fg-dim);
  border-radius: 2px; padding: 1px 7px;
}
.panel > header .tag.hot { background: var(--ember); }
.panel > header .spacer { flex: 1 1 auto; }

.row {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 13px 16px; border-top: 1px solid var(--line);
}
.panel .row:first-of-type { border-top: 0; }
.row .main { flex: 1 1 230px; min-width: 0; }
.row .main strong { display: block; font: 400 14.5px var(--body); font-weight: 600; }
.row .meta {
  font: 400 11.5px var(--mono); color: var(--fg-faint);
  letter-spacing: .02em; font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.row .actions { display: flex; gap: 7px; }

.pill {
  font: 500 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 2px; white-space: nowrap; border: 1px solid;
}
.pill.ok   { color: var(--aurora);  border-color: rgba(79,224,196,.4);  background: rgba(79,224,196,.08); }
.pill.wait { color: var(--lantern); border-color: rgba(255,194,77,.4);  background: rgba(255,194,77,.08); }
.pill.bad  { color: var(--ember);   border-color: rgba(255,107,92,.4);  background: rgba(255,107,92,.08); }

/* Instrumentos de anillo para el cupo. */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px; padding: 16px; }
.gauge { text-align: center; min-width: 0; }
.gauge svg { display: block; margin: 0 auto 7px; }
.gauge .ring-bg { fill: none; stroke: var(--line); stroke-width: 6; }
.gauge .ring-fg { fill: none; stroke: var(--aurora); stroke-width: 6; stroke-linecap: round;
                  transform: rotate(-90deg); transform-origin: 50% 50%;
                  transition: stroke-dashoffset .6s ease; }
.gauge.hot .ring-fg { stroke: var(--ember); }
.gauge .val { font: 700 15px var(--mono); fill: var(--fg); }
.gauge .cap { font: 400 9px var(--mono); fill: var(--fg-faint); }
.gauge .who { font: 500 10.5px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); }
.gauge .left { font: 400 10.5px var(--mono); color: var(--fg-faint); }

.empty { padding: 24px 16px; color: var(--fg-faint); font-size: 13.5px; text-align: center; }
.empty b { color: var(--fg-dim); font-weight: 600; }

pre { font: 400 11px/1.5 var(--mono); margin: 5px 0 0; white-space: pre-wrap;
      color: var(--fg-faint); overflow-wrap: anywhere; }

.alert {
  border: 1px solid var(--ember); background: rgba(255,107,92,.09);
  color: #ffb3aa; border-radius: 4px; padding: 13px 16px; margin-bottom: 20px;
  font-size: 13.5px; overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<canvas id="field" aria-hidden="true"></canvas>
<div id="grid" aria-hidden="true"></div>

<div class="wrap">
  <header class="masthead">
    <div class="mark">
      <div class="beacon" aria-hidden="true"></div>
      <div>
        <h1>Lantern <em>Control</em></h1>
        <div class="stamp" id="stamp">iniciando telemetría…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <button id="refresh">Actualizar</button>
      <button class="ignite" id="run">Encender 3 episodios</button>
    </div>
  </header>

  <div id="alert" class="alert" hidden></div>

  <!-- La tubería es el eje: muestra dónde está el trabajo ahora mismo. -->
  <div class="pipeline">
    <div class="pipe-track" id="pipe"></div>
  </div>

  <div class="deck">
    <div style="display:grid; gap:16px; min-width:0">
      <section class="panel">
        <header>
          <h2>Esperando tu revisión</h2>
          <span class="spacer"></span>
          <span class="tag" id="tag-review">0</span>
        </header>
        <div id="review"></div>
      </section>

      <section class="panel">
        <header><h2>Cola de publicación</h2><span class="spacer"></span><span class="tag" id="tag-queue">0</span></header>
        <div id="queue"></div>
      </section>

      <section class="panel">
        <header><h2>Series y arco narrativo</h2></header>
        <div id="series"></div>
      </section>
    </div>

    <div style="display:grid; gap:16px; min-width:0">
      <section class="panel">
        <header><h2>Cupo de hoy</h2></header>
        <div class="gauges" id="gauges"></div>
      </section>

      <section class="panel">
        <header><h2>Rendimiento</h2></header>
        <div id="perf"></div>
      </section>

      <section class="panel">
        <header><h2>Bitácora del orquestador</h2></header>
        <div id="runs"></div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n ?? 0).toLocaleString('es-CO');
const when = t => t ? new Date(t).toLocaleString('es-CO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

/* ─── Campo profundo ──────────────────────────────────────────
   Partículas lentas con deriva. Decorativo, pero fija el tono del
   instrumento. Se detiene si el visitante pidió menos movimiento. */
(function field() {
  const c = $('field'), ctx = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, motes = [];
  const DPR = Math.min(devicePixelRatio || 1, 2);

  function size() {
    w = c.width = innerWidth * DPR;
    h = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    const count = Math.round(innerWidth * innerHeight / 14000);
    motes = Array.from({ length: Math.min(count, 150) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.5 + .4) * DPR,
      vy: (Math.random() * .16 + .04) * DPR,
      vx: (Math.random() - .5) * .07 * DPR,
      a: Math.random() * .5 + .12,
      warm: Math.random() < .3,
    }));
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    // Resplandor de horizonte: ancla la composición arriba.
    const g = ctx.createRadialGradient(w * .5, -h * .18, 0, w * .5, -h * .18, h * .95);
    g.addColorStop(0, 'rgba(167,139,250,.17)');
    g.addColorStop(.45, 'rgba(79,224,196,.055)');
    g.addColorStop(1, 'rgba(7,6,15,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    for (const m of motes) {
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = m.warm
        ? `rgba(255,194,77,${m.a * .75})`
        : `rgba(205,214,255,${m.a})`;
      ctx.fill();
      if (!still) {
        m.y -= m.vy; m.x += m.vx;
        if (m.y < -4) { m.y = h + 4; m.x = Math.random() * w; }
        if (m.x < -4) m.x = w; else if (m.x > w + 4) m.x = 0;
      }
    }
    if (!still) requestAnimationFrame(frame);
  }

  size();
  addEventListener('resize', () => { size(); if (still) frame(); });
  frame();
})();

/* ─── Estado ──────────────────────────────────────────────── */
function panelSecret() {
  try { return localStorage.getItem('panel-secret') ?? ''; } catch { return ''; }
}

function alertBox(msg) {
  const el = $('alert');
  if (!msg) { el.hidden = true; el.textContent = ''; return; }
  el.hidden = false;
  el.textContent = msg;
}

async function load() {
  alertBox('');
  $('stamp').textContent = 'leyendo telemetría…';
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('el servidor respondió ' + res.status);
    render(await res.json());
  } catch (e) {
    $('stamp').textContent = 'sin enlace con el servidor';
    alertBox('No se pudieron cargar los datos: ' + e.message
      + '. Revisa que SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY estén configuradas en Vercel.');
    renderPipe(null);
  }
}

function render(d) {
  $('stamp').textContent = 'telemetría · ' + when(d.generatedAt);
  renderPipe(d);
  renderReview(d);
  renderGauges(d);
  renderQueue(d);
  renderSeries(d);
  renderPerf(d);
  renderRuns(d);
}

/* La tubería nombra cada etapa y marca cuál está esperando a una persona. */
function renderPipe(d) {
  if (!d) { $('pipe').innerHTML = '<div class="stage block"><div class="dot"></div><div class="label">sin datos</div></div>'; return; }
  const eps = d.episodes;
  const n = s => eps.filter(e => e.status === s).length;
  const stages = [
    { label: 'Series',     n: d.series.length,                    note: 'arcos activos',   state: d.series.length ? 'done' : '' },
    { label: 'Esquema',    n: n('outlined'),                      note: 'episodios',       state: n('outlined') ? 'live' : '' },
    { label: 'Guion',      n: n('scripted'),                      note: 'escritos',        state: n('scripted') ? 'live' : '' },
    { label: 'Producción', n: n('produced'),                      note: 'imágenes + voz',  state: n('produced') ? 'done' : '' },
    { label: 'Revisión',   n: d.pendingReview.length,             note: 'te esperan',      state: d.pendingReview.length ? 'block' : 'done' },
    { label: 'Cola',       n: d.queue.filter(q => q.status === 'queued').length, note: 'programados', state: 'done' },
    { label: 'Al aire',    n: d.published.length,                 note: 'publicados',      state: d.published.length ? 'done' : '' },
  ];
  $('pipe').innerHTML = stages.map(s => `
    <div class="stage ${s.state}">
      <div class="dot"></div>
      <div class="label">${esc(s.label)}</div>
      <div class="n">${fmt(s.n)}</div>
      <div class="note">${esc(s.note)}</div>
    </div>`).join('');
}

function renderReview(d) {
  const list = d.pendingReview;
  const tag = $('tag-review');
  tag.textContent = list.length;
  tag.className = 'tag' + (list.length ? ' hot' : '');
  $('review').innerHTML = list.length ? list.map(v => `
    <div class="row">
      <div class="main">
        <strong>${esc(v.title)}</strong>
        <div class="meta">${v.duration_sec}s${v.hook ? ' · ' + esc(v.hook) : ''}</div>
      </div>
      <span class="pill wait">sin revisar</span>
      <div class="actions">
        ${v.media_url ? `<a href="${esc(v.media_url)}" target="_blank" rel="noopener"><button class="ghost">Ver</button></a>` : ''}
        <button class="ghost" data-approve="${esc(v.id)}">Aprobar</button>
        <button class="ghost" data-reject="${esc(v.id)}">Rechazar</button>
      </div>
    </div>`).join('')
    : '<div class="empty">Nada pendiente.<br><b>Encender 3 episodios</b> arranca una tanda.</div>';
}

/* Anillo por cuenta: el consumo del día se lee de un golpe. */
function renderGauges(d) {
  if (!d.quotas.length) {
    $('gauges').innerHTML = '<div class="empty" style="grid-column:1/-1">Sin cuentas registradas.</div>';
    return;
  }
  const R = 30, C = 2 * Math.PI * R;
  $('gauges').innerHTML = d.quotas.map(q => {
    const frac = q.cap ? Math.min(1, q.used / q.cap) : 0;
    const hot = frac > .8;
    return `<div class="gauge ${hot ? 'hot' : ''}">
      <svg width="78" height="78" viewBox="0 0 78 78" role="img"
           aria-label="${esc(q.label || q.platform)}: ${q.used} de ${q.cap} usados">
        <circle class="ring-bg" cx="39" cy="39" r="${R}"></circle>
        <circle class="ring-fg" cx="39" cy="39" r="${R}"
                stroke-dasharray="${C.toFixed(1)}"
                stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"></circle>
        <text class="val" x="39" y="38" text-anchor="middle">${q.used}</text>
        <text class="cap" x="39" y="50" text-anchor="middle">de ${q.cap}</text>
      </svg>
      <div class="who">${esc(q.label || q.platform)}</div>
      <div class="left">${q.remaining > 0 ? 'quedan ' + q.remaining : 'agotado'}</div>
    </div>`;
  }).join('');
}

function renderQueue(d) {
  $('tag-queue').textContent = d.queue.length;
  $('queue').innerHTML = d.queue.length ? d.queue.map(p => `
    <div class="row">
      <div class="main">
        <strong>${esc(p.videos?.title ?? 'sin título')}</strong>
        <div class="meta">${esc(p.accounts?.platform ?? '')} · ${esc(p.accounts?.handle ?? '')} · ${when(p.scheduled_for)}</div>
        ${p.error ? `<div class="meta">${esc(p.error)}</div>` : ''}
      </div>
      <span class="pill ${p.status === 'queued' ? 'ok' : p.status === 'skipped_quota' ? 'wait' : 'bad'}">${esc(p.status)}</span>
    </div>`).join('') : '<div class="empty">La cola está vacía.</div>';
}

function renderSeries(d) {
  $('series').innerHTML = d.series.length ? d.series.map(s => {
    const eps = d.episodes.filter(e => e.series_id === s.id);
    const cast = (s.characters ?? []).map(c => c.name).filter(Boolean).join(' · ');
    return `<div class="row">
      <div class="main">
        <strong>${esc(s.title)}</strong>
        <div class="meta">${cast ? esc(cast) + ' — ' : ''}${eps.length} episodios</div>
        ${eps.length ? `<pre>${eps.map(e => `${String(e.number).padStart(2,'0')} ${e.title}  [${e.status}]`).join('\n')}</pre>` : ''}
      </div>
      <span class="pill ${s.status === 'active' ? 'ok' : 'wait'}">${esc(s.status)}</span>
    </div>`;
  }).join('') : '<div class="empty">Ninguna serie todavía.</div>';
}

function renderPerf(d) {
  const t = d.totals;
  $('perf').innerHTML = `
    <div class="row"><div class="main"><strong>${fmt(t.views)}</strong>
      <div class="meta">vistas acumuladas</div></div></div>
    <div class="row"><div class="main"><strong>USD ${t.revenue ?? 0}</strong>
      <div class="meta">ingreso reportado</div></div></div>
    <div class="row"><div class="main"><strong>${t.avgRpm ?? '—'}</strong>
      <div class="meta">RPM promedio${t.avgRpm ? '' : ' · aún sin métricas'}</div></div></div>`;
}

function renderRuns(d) {
  $('runs').innerHTML = d.runs.length ? d.runs.map(r => `
    <div class="row">
      <div class="main">
        <strong>${when(r.started_at)}</strong>
        <div class="meta">${esc(r.stage)} · ${r.credits_spent} créditos</div>
      </div>
      <span class="pill ${r.status === 'completed' ? 'ok' : r.status === 'running' ? 'wait' : 'bad'}">${esc(r.status)}</span>
    </div>`).join('') : '<div class="empty">Sin corridas registradas.</div>';
}

/* ─── Acciones ────────────────────────────────────────────── */
async function review(videoId, approved) {
  alertBox('');
  try {
    const res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ videoId, approved, reviewer: 'panel' }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.status);
    await load();
  } catch (e) {
    alertBox('No se pudo guardar la revisión: ' + e.message);
  }
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-approve]');
  const r = e.target.closest('[data-reject]');
  if (a) review(a.dataset.approve, true);
  if (r) review(r.dataset.reject, false);
});

$('refresh').addEventListener('click', load);

$('run').addEventListener('click', async () => {
  const btn = $('run');
  btn.disabled = true;
  btn.textContent = 'Encendiendo…';
  alertBox('');
  try {
    const res = await fetch('/api/trigger', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-panel-secret': panelSecret() },
      // Tope conservador: un clic accidental no puede gastar el cupo del mes.
      body: JSON.stringify({ episodes: 3, creditBudget: 30 }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error ?? res.status);
    await load();
  } catch (e) {
    alertBox('No se pudo producir: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Encender 3 episodios';
  }
});

load();
</script>
