<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talonario de Servicios - Velik Beauty House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 30px;
        }

        .talonario {
            border: 2px dashed #DCC7B2;
            border-radius: 10px;
            padding: 25px;
            position: relative;
            background-color: #fffaf5;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #DCC7B2;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: #111;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            display: flex;
            align-items: flex-end;
        }

        .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: #333;
            margin-right: 10px;
            white-space: nowrap;
        }

        .form-line {
            flex: 1;
            border-bottom: 1px solid #999;
            height: 20px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .checkbox-box {
            width: 14px;
            height: 14px;
            border: 1px solid #666;
            display: inline-block;
        }

        .footer-signatures {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .signature {
            width: 45%;
            text-align: center;
        }

        .signature-line {
            border-bottom: 1px solid #333;
            height: 40px;
            margin-bottom: 5px;
        }

        .signature-label {
            font-size: 12px;
            color: #666;
        }

        /* Ocultar sombras y márgenes al imprimir */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .page {
                box-shadow: none;
                width: 100%;
                height: 100%;
                padding: 0;
            }
            .talonario {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="page">
        <!-- Generar 3 talonarios por página -->
        <script>
            for(let i=0; i<3; i++) {
                document.write(`
                <div class="talonario">
                    <div class="header">
                        <h1>VELIK</h1>
                        <p>Beauty House • Ficha de Servicio</p>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label>Fecha:</label>
                            <div class="form-line"></div>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Hora:</label>
                            <div class="form-line"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre Usuaria/Cliente:</label>
                            <div class="form-line"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label>Nombre Profesional:</label>
                            <div class="form-line"></div>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Cód. Profesional:</label>
                            <div class="form-line"></div>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 25px;">
                        <div class="form-group">
                            <label>Servicio Realizado:</label>
                            <div class="form-line"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <div class="form-line"></div>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 20px;">
                        <label style="font-weight: 600; font-size: 13px; color: #333; margin-right: 15px;">Método de Pago:</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item"><span class="checkbox-box"></span> Efectivo</div>
                            <div class="checkbox-item"><span class="checkbox-box"></span> Tarjeta (Datafono)</div>
                            <div class="checkbox-item"><span class="checkbox-box"></span> Transferencia / Wompi</div>
                        </div>
                    </div>

                    <div class="footer-signatures">
                        <div class="signature">
                            <div class="signature-line"></div>
                            <div class="signature-label">Firma Cliente (Conformidad)</div>
                        </div>
                        <div class="signature">
                            <div class="signature-line"></div>
                            <div class="signature-label">Firma Profesional</div>
                        </div>
                    </div>
                </div>
                `);
            }
        </script>
    </div>

</body>
</html>
